spring:
  application:
    name: dna-storage
  data:
    mongodb:
      uri: mongodb://localhost:27017/dna_storage
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:your-google-client-id}
            client-secret: ${GOOGLE_CLIENT_SECRET:your-google-client-secret}
            scope: openid, profile, email

app:
  jwt:
    # must be >= 32 chars for HS256
    secret: ${JWT_SECRET:dna-storage-demo-secret-change-me-0123456789}
    expiry-minutes: 720
  python:
    script: python/dna_codec.py
  frontend-url: http://localhost:5173
  # dev-only: set true to mint demo JWTs without Google (POST /api/auth/dev-token)
  dev-mode: false

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
